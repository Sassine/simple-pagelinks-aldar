<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Al Dar Restaurante — Bauru</title>
  <meta name="description" content="Al Dar Restaurante — Cozinha Libanesa Internacional em Bauru. Cardápio, pedidos pelo iFood, WhatsApp e localização." />
  <meta name="theme-color" content="#08101C" />

  <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />
  <link rel="apple-touch-icon" href="assets/logo.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --azul-profundo: #08101C;
      --azul-ardosia: #536480;
      --branco-neve: #F5F7F8;
      --cinza-gelo: #C8D0D8;
      --dourado: #C6A96B;
      --bege-papel: #E9DFC8;
    }

    @property --angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--branco-neve);
      background: var(--azul-profundo);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;

      /* Subtle arabesque-inspired pattern at low opacity (per design system) */
      background-image:
        radial-gradient(ellipse at top, rgba(83, 100, 128, 0.18), transparent 60%),
        radial-gradient(ellipse at bottom, rgba(198, 169, 107, 0.06), transparent 60%);
    }

    .page {
      max-width: 440px;
      margin: 0 auto;
      padding: 40px 24px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
    }

    /* Brand block */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
      margin-bottom: 36px;
    }

    .brand__logo {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--branco-neve);
      box-shadow:
        0 0 0 1px rgba(245, 247, 248, 0.06),
        0 0 0 6px rgba(198, 169, 107, 0.10),
        0 16px 40px rgba(0, 0, 0, 0.35);
    }

    .brand__name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600;
      font-size: 32px;
      letter-spacing: 0.02em;
      color: var(--branco-neve);
      margin-top: 4px;
    }

    .brand__tagline {
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--cinza-gelo);
      opacity: 0.9;
    }

    /* Hours block */
    .hours {
      width: 100%;
      margin-top: 4px;
      margin-bottom: 28px;
      padding: 14px 18px;
      border: 1px solid rgba(198, 169, 107, 0.25);
      border-radius: 14px;
      background: rgba(83, 100, 128, 0.10);
      text-align: center;
    }

    .hours__title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--dourado);
      margin-bottom: 8px;
    }

    .hours__row {
      font-size: 13px;
      line-height: 1.5;
      color: var(--branco-neve);
    }

    .hours__row + .hours__row { margin-top: 2px; }

    .hours__days {
      color: var(--cinza-gelo);
      letter-spacing: 0.04em;
    }

    .hours__note {
      display: block;
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--cinza-gelo);
      opacity: 0.75;
      margin-top: 6px;
    }

    /* Links */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 18px 22px;
      border-radius: 999px;
      color: var(--azul-profundo);
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.01em;
      border: 2px solid transparent;
      overflow: hidden;
      isolation: isolate;
      transition:
        transform 180ms cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 220ms ease,
        letter-spacing 220ms ease;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);

      /* Rotating gold conic on the border, solid white fill inside */
      background:
        linear-gradient(var(--branco-neve), var(--branco-neve)) padding-box,
        conic-gradient(
          from var(--angle),
          rgba(198, 169, 107, 0) 0deg,
          rgba(198, 169, 107, 0.85) 50deg,
          rgba(198, 169, 107, 0) 120deg,
          rgba(198, 169, 107, 0) 240deg,
          rgba(198, 169, 107, 0.85) 310deg,
          rgba(198, 169, 107, 0) 360deg
        ) border-box;

      opacity: 0;
      transform: translateY(10px);
      animation:
        linkIn 520ms cubic-bezier(0.22, 1, 0.36, 1) forwards,
        linkBorderSpin 6s linear infinite;
    }

    /* Stagger entrance */
    .links .link:nth-child(1) { animation-delay: 120ms; }
    .links .link:nth-child(2) { animation-delay: 200ms; }
    .links .link:nth-child(3) { animation-delay: 280ms; }
    .links .link:nth-child(4) { animation-delay: 360ms; }

    /* Gold shine sweep */
    .link::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        100deg,
        transparent 25%,
        rgba(198, 169, 107, 0.28) 50%,
        transparent 75%
      );
      transform: translateX(-120%);
      transition: transform 800ms cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
      z-index: 0;
    }

    .link > * { position: relative; z-index: 1; }

    .link:hover,
    .link:focus-visible {
      transform: translateY(-2px);
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.30),
        0 0 0 1px rgba(198, 169, 107, 0.35),
        0 4px 18px rgba(198, 169, 107, 0.28);
      outline: none;
      letter-spacing: 0.02em;
    }

    .link:hover::before,
    .link:focus-visible::before {
      transform: translateX(120%);
    }

    .link:active {
      transform: translateY(0) scale(0.985);
      transition-duration: 90ms;
    }

    .link__icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      transition: transform 320ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .link:hover .link__icon,
    .link:focus-visible .link__icon {
      transform: scale(1.12);
    }

    .link__label {
      flex: 1;
      text-align: center;
      transition: transform 220ms ease;
    }

    .link:hover .link__label,
    .link:focus-visible .link__label {
      transform: translateX(-4px);
    }

    .link__arrow {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: var(--azul-ardosia);
      opacity: 0;
      transform: translateX(-8px);
      transition:
        opacity 220ms ease,
        transform 280ms cubic-bezier(0.22, 1, 0.36, 1),
        color 220ms ease;
    }

    .link:hover .link__arrow,
    .link:focus-visible .link__arrow {
      opacity: 1;
      transform: translateX(0);
      color: var(--dourado);
    }

    @keyframes linkIn {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes linkBorderSpin {
      to { --angle: 360deg; }
    }

    /* Social row */
    .social {
      margin-top: 32px;
      display: flex;
      gap: 18px;
      justify-content: center;
    }

    .social a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      color: var(--branco-neve);
      background: rgba(245, 247, 248, 0.06);
      border: 1px solid rgba(245, 247, 248, 0.12);
      text-decoration: none;
      transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
    }

    .social a:hover,
    .social a:focus-visible {
      background: rgba(198, 169, 107, 0.16);
      border-color: var(--dourado);
      outline: none;
      transform: translateY(-1px);
    }

    .social svg { width: 20px; height: 20px; }

    /* Footer */
    .footer {
      margin-top: auto;
      padding-top: 32px;
      font-size: 12px;
      letter-spacing: 0.06em;
      color: var(--cinza-gelo);
      opacity: 0.6;
      text-align: center;
    }

    @media (min-width: 480px) {
      .brand__logo { width: 128px; height: 128px; }
      .brand__name { font-size: 36px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      .link {
        animation: linkIn 1ms linear forwards;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="brand">
      <img class="brand__logo" src="assets/logo.jpg" alt="Al Dar Restaurante" />
      <h1 class="brand__name">Al Dar Restaurante</h1>
      <p class="brand__tagline">Cozinha Libanesa Internacional</p>
    </section>

    <section class="hours" aria-label="Horário de funcionamento">
      <p class="hours__title">Horário de funcionamento</p>
      <p class="hours__row">
        <span class="hours__days">Ter — Sex</span> · 11:15 às 15h

      <p class="hours__row">

      <span class="hours__note">Buffet, iFood e retirada</span>

        <svg class="link__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

      <!-- 4. Localização -->
      <a class="link" href="https://maps.app.goo.gl/QAuC5LoB4FFRRoWH9" target="_blank" rel="noopener">

    <div class="social" aria-label="Redes sociais">
      <a href="https://www.instagram.com/restaurantealdar/" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.5" cy="6.5" r="0.6" fill="currentColor" />
        </svg>
      </a>
    </div>

    <p class="footer">© Al Dar Restaurante · Bauru</p>
  </main>
</body>
</html>
